name: Upgrade Foyho TV 2.2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-v22:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Write Foyho TV 2.2 source
        shell: bash
        run: |
          mkdir -p app/src/main/java/it/salottino/tv app/src/main
          echo '' | base64 -d | gzip -d > app/src/main/java/it/salottino/tv/MainActivity.java
          echo '' | base64 -d | gzip -d > app/src/main/AndroidManifest.xml
          echo 'H4sIANqR32oC/42OQQrCMBBF9znF7LILWhEPUFzowoKCWxmbWAbTJDTTgkjvbqpViiD4l3+Y91+wbUUuwh1Igyx9rdDpxpNWGIKlEpm8k9ALMfZwF5DisDYxYGlAEquI1jOT84o7+bwnUiBrDvoKi6V4VtpcsLWce3ehasQMmQxt9A/ckJrcgMvmn4axqQyPG++yM01MqNxrA4vvdpe0QWYqU7MXuBdT3SIMFnEiF33blCZP5yR4Jkt8gy12eHzx1HG9P2yK3Wm++rL6+6UXvXgAeB7troYBAAA=' | base64 -d | gzip -d > app/build.gradle

      - name: Save Foyho TV 2.2 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/it/salottino/tv/MainActivity.java app/src/main/AndroidManifest.xml app/build.gradle
          git diff --cached --quiet || git commit -m "Upgrade to Foyho TV 2.2"
          git push

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Foyho TV 2.2 APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Foyho-TV-2.2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
