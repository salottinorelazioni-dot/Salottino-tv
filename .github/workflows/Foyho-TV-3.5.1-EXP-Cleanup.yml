name: Foyho TV 3.5.1 EXP Cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment-3.5
          fetch-depth: 0

      - name: Apply EXP cleanup and TV System focus fix
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/foyho351.py
          python3 /tmp/foyho351.py

      - name: Save only to experimental branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/it/salottino/tv/MainActivity.java app/build.gradle
          git diff --cached --quiet || git commit -m "Foyho TV 3.5.1 EXP cleanup"
          git push origin HEAD:experiment-3.5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build experimental APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Foyho-TV-3.5.1-EXP-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
