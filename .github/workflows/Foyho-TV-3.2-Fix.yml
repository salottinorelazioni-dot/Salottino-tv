name: Fix Foyho TV 3.2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply corrected Foyho TV 3.2 source
        shell: bash
        run: |
          python3 - <<'PYFIX'
          from pathlib import Path
          import base64, re

          java_b64 = ""
          java = base64.b64decode(java_b64).decode("utf-8")
          Path("app/src/main/java/it/salottino/tv/MainActivity.java").write_text(java, encoding="utf-8")

          gpath = Path("app/build.gradle")
          g = gpath.read_text(encoding="utf-8")
          g = re.sub(r"versionCode\s+\d+", "versionCode 12", g, count=1)
          g = re.sub(r"versionName\s+'[^']+'", "versionName '3.2.0'", g, count=1)
          gpath.write_text(g, encoding="utf-8")

          print("Foyho TV 3.2 source applied")
          PYFIX

      - name: Save Foyho TV 3.2 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/it/salottino/tv/MainActivity.java app/build.gradle
          git diff --cached --quiet || git commit -m "Apply Foyho TV 3.2 top-right icons"
          git push

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Foyho-TV-3.2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
