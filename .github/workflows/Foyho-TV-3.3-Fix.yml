name: Fix Foyho TV 3.3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix profile settings action only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/it/salottino/tv/MainActivity.java")
          s = p.read_text(encoding="utf-8")

          old = 'profile.setOnClickListener(v -> safeStart(Settings.ACTION_USER_SETTINGS));'
          new = 'profile.setOnClickListener(v -> safeStart("android.settings.USER_SETTINGS"));'

          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit("Riga profilo non trovata")

          p.write_text(s, encoding="utf-8")
          print("Fix profilo applicato senza modificare il layout 2.7")
          PY

      - name: Save Foyho TV 3.3 fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/it/salottino/tv/MainActivity.java
          git diff --cached --quiet || git commit -m "Fix Foyho TV 3.3 profile action"
          git push

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Foyho-TV-3.3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
