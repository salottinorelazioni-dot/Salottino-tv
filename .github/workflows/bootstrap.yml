
name: Build Salottino TV

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Android TV project
        shell: bash
        run: |
          mkdir -p app/src/main/java/it/salottino/tv

          cat > settings.gradle <<'GRADLE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'SalottinoTV'
          include ':app'
          GRADLE

          cat > build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          GRADLE

          cat > app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' }

          android {
              namespace 'it.salottino.tv'
              compileSdk 35

              defaultConfig {
                  applicationId 'it.salottino.tv'
                  minSdk 21
                  targetSdk 35
                  versionCode 1
                  versionName '0.1.0'
              }
          }
          GRADLE

          cat > app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:label="Salottino TV"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > app/src/main/java/it/salottino/tv/MainActivity.java <<'JAVA'
          package it.salottino.tv;

          import android.app.*;
          import android.os.*;
          import android.provider.Settings;
          import android.content.*;
          import android.content.pm.*;
          import android.graphics.Color;
          import android.graphics.drawable.Drawable;
          import android.view.*;
          import android.widget.*;
          import java.text.SimpleDateFormat;
          import java.util.*;

          public class MainActivity extends Activity {
              private LinearLayout appsRow;
              private TextView clock;
              private final Handler handler = new Handler(Looper.getMainLooper());

              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  buildUi();
                  updateClock();
              }

              private TextView text(String value, int sp) {
                  TextView v = new TextView(this);
                  v.setText(value); v.setTextColor(Color.WHITE); v.setTextSize(sp);
                  return v;
              }

              private void buildUi() {
                  ScrollView scroll = new ScrollView(this);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(64, 42, 64, 42);
                  root.setBackgroundColor(Color.rgb(11,15,20));
                  scroll.addView(root);

                  LinearLayout header = new LinearLayout(this);
                  header.setGravity(Gravity.CENTER_VERTICAL);
                  TextView title = text("SALOTTINO TV", 30);
                  title.setTypeface(null, 1);
                  header.addView(title, new LinearLayout.LayoutParams(0, -2, 1));
                  clock = text("", 26);
                  header.addView(clock);
                  root.addView(header);

                  TextView subtitle = text("La tua TV. Semplice, pulita, senza pubblicità.", 17);
                  subtitle.setTextColor(Color.LTGRAY);
                  LinearLayout.LayoutParams sub = new LinearLayout.LayoutParams(-1,-2);
                  sub.setMargins(0,8,0,34);
